<!DOCTYPE html>
<html>
<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>臭肥佬</title>
      <style>
            :root{
                  --max-width: 980px;
                  --bg: #f7f9fc;
                  --card: #ffffff;
                  --accent: #2c7be5;
                  --muted: #6c757d;
            }
            html, body {
                  height: 100%;
                  margin: 0;
                  padding: 0;
                  font-family: "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", sans-serif;
                  background: var(--bg);
                  color: #111;
            }
            .container{
                  max-width: var(--max-width);
                  margin: 32px auto;
                  padding: 24px;
                  background: var(--card);
                  border-radius: 8px;
                  box-shadow: 0 6px 18px rgba(12,38,63,0.08);
            }
            h1{
                  margin: 0 0 12px 0;
                  font-size: 28px;
                  color: var(--accent);
            }
            p{
                  margin: 0 0 16px 0;
                  line-height: 1.6;
                  color: var(--muted);
            }
            footer{
                  margin-top: 20px;
                  font-size: 13px;
                  color: var(--muted);
            }
            @media (max-width: 600px){
                  .container{margin: 16px;padding: 16px}
                  h1{font-size: 20px}
            }
            img{
               width:50%;
               height:auto;
               margin-left: 25%;
               margin-right: 25%;
            }
      </style>
</head>
<body>
        <div class="container">
                  <h1>历史街区调查数据可视化</h1>
                  <p>本项目旨在通过数据可视化技术，展示历史街区的调查数据，帮助用户更直观地理解和分析这些数据。</p>

                    <!-- ECharts 已移除：图表容器与控制按钮已删除 -->

                                    <footer>来源： 中国政府网之肥佬 · <time id="stamp" datetime="2025-03-05">2025-03-05 16:29</time></footer>
                                    <div style="text-align:center;margin-top:12px;">
                                          <img id="funnyImg" src="/myweb/肥水.jpg" alt="肥水图片" class="interactive-img" style="max-width:320px;width:60%;height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.08);" />
                                    </div>

                                    <!-- 图片模态大图 -->
                                    <div id="imgModal" class="img-modal" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(6,12,24,0.75);align-items:center;justify-content:center;padding:24px;">
                                          <div style="position:relative;max-width:1200px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
                                                <img id="modalImg" src="肥水.jpg" alt="放大图" style="max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,0.5);" />
                                                <button id="closeImg" aria-label="关闭" style="position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.9);border:0;padding:8px 10px;border-radius:6px;cursor:pointer">关闭</button>
                                                <a id="downloadImg" download="肥水.jpg" style="position:absolute;top:12px;right:84px;background:rgba(255,255,255,0.9);padding:8px 10px;border-radius:6px;text-decoration:none;color:#111;">下载</a>
                                          </div>
                                    </div>
        </div>

        <script>
                  // 图片交互与时间更新（已移除 ECharts 相关代码）
                  (function(){
                        // 更新 footer 时间为当前本地格式（可保留原 datetime）
                        var stamp = document.getElementById('stamp');
                        try{
                              var now = new Date();
                              var fmt = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                              stamp.textContent = fmt;
                              stamp.setAttribute('datetime', now.toISOString());
                        }catch(e){ /* ignore */ }

                        // ===== 图片交互逻辑 =====
                        var img = document.getElementById('funnyImg');
                        var modal = document.getElementById('imgModal');
                        var modalImg = document.getElementById('modalImg');
                        var closeBtn = document.getElementById('closeImg');
                        var downloadLink = document.getElementById('downloadImg');
                        var isGray = false;

                        // Hover 样式通过 CSS（在行内样式外可扩展），这里加事件仅为可扩展交互
                        img.style.transition = 'transform 220ms ease, filter 220ms ease';
                        img.style.cursor = 'pointer';
                        img.addEventListener('mouseenter', function(){ img.style.transform = 'scale(1.04)'; });
                        img.addEventListener('mouseleave', function(){ img.style.transform = ''; });

                        // 双击切换灰度
                        img.addEventListener('dblclick', function(){
                              isGray = !isGray;
                              img.style.filter = isGray ? 'grayscale(100%)' : '';
                        });

                        // 单击打开模态大图
                        img.addEventListener('click', function(){
                              modal.style.display = 'flex';
                              modal.setAttribute('aria-hidden','false');
                              // 使用同一张图源，也可以替换为高分辨率图片路径
                              modalImg.src = img.src;
                              downloadLink.href = img.src;
                        });

                        function closeModal(){
                              modal.style.display = 'none';
                              modal.setAttribute('aria-hidden','true');
                        }

                        closeBtn.addEventListener('click', closeModal);
                        // 点击模态背景也关闭（点击图片本身不关闭）
                        modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
                        // ESC 关闭
                        window.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

                  })();
        </script>
</html>
