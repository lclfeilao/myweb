<!DOCTYPE html>
<html>
<head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>历史街区调查数据可视化</title>
      <style>
            :root{
                  --max-width: 980px;
                  --bg: #f7f9fc;
                  --card: #ffffff;
                  --accent: #2c7be5;
                  --muted: #6c757d;
            }
            html, body {
                  height: 100%;
                  margin: 0;
                  padding: 0;
                  font-family: "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", sans-serif;
                  background: var(--bg);
                  color: #111;
            }
            .container{
                  max-width: var(--max-width);
                  margin: 32px auto;
                  padding: 24px;
                  background: var(--card);
                  border-radius: 8px;
                  box-shadow: 0 6px 18px rgba(12,38,63,0.08);
            }
            h1{
                  margin: 0 0 12px 0;
                  font-size: 28px;
                  color: var(--accent);
            }
            p{
                  margin: 0 0 16px 0;
                  line-height: 1.6;
                  color: var(--muted);
            }
            footer{
                  margin-top: 20px;
                  font-size: 13px;
                  color: var(--muted);
            }
            @media (max-width: 600px){
                  .container{margin: 16px;padding: 16px}
                  h1{font-size: 20px}
            }
      </style>
</head>
<body>
      <div class="container">
            <h1>历史街区调查数据可视化</h1>
            <p>本项目旨在通过数据可视化技术，展示历史街区的调查数据，帮助用户更直观地理解和分析这些数据。</p>
            <footer>来源： 中国政府网之最臭的肥佬 · <time datetime="2025-03-05">2025-03-05 16:29</time></footer>
      </div>
</body>
</html>
